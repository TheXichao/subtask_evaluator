[project]
name = "subtask-checker"
version = "0.1.0"
description = "Data pipeline for evaluating robot-video subtask annotations (Qwen3-VL evaluator groundwork)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pillow>=10.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtask_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
